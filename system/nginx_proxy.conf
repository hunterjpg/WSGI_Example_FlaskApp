upstream flask_wsgi {
    # Use a socket file
    #server unix:/tmp/uwsgi.sock fail_timeout=0;

    # Or define the host explicitly
    server 127.0.0.1:8000;
}


server {
    listen 80;
    server_name horseworld.ca www.horseworld.ca;

    access_log  /var/log/flask_wsgi/access.log  main;
    error_log   /var/log/flask_wsgi/error.log  info;

    location / {
        include /etc/nginx/mime.types;
        include uwsgi_params;

        uwsgi_connect_timeout 30;
        uwsgi_read_timeout 60;
        uwsgi_send_timeout 60;

        # Use uwsgi with the socket file
        #uwsgi_pass unix:/tmp/uwsgi.sock;

        # Or use the upstream definition
        #uwsgi_pass flask_wsgi;

        # Or directly pass the server 
        #uwsgi_pass http://127.0.0.1:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /;

        # Use the upstream definition
        proxy_pass http://flask_wsgi/;

        # Or directly pass the server 
        #proxy_pass http://127.0.0.1:8000/;
    }

    location = /robots.txt {
        alias /var/www/flask_wsgi/src/static/robots.txt;
        access_log off;
    }

    location /static/ {
        include /etc/nginx/mime.types;
        alias /var/www/flask_wsgi/src/static/;
    }
}
