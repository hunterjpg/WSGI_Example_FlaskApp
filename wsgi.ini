[uwsgi]
http-socket = 127.0.0.1:8000
socket = /tmp/uwsgi.sock
chmod-socket = 660

module = wsgi:app
master = True
processes = 2
threads = 2

uid = nginx
gid = nginx

die-on-term = true
harakiri = 60
harakiri-verbose = true

enable-threads = true

logto = /var/log/nginx/flask/app.log
log-maxsize = 10485760
